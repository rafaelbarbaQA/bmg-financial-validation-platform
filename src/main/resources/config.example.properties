# CONFIGURACAO DE AMBIENTE - EXEMPLO

# Copie para um arquivo local, por exemplo:
# config-128.properties
#
# Execute com:
# mvn test -Denv=128
#
# Nunca versione usuarios, senhas ou tokens.

# Web Services
WS_URL=CHANGE_ME

# SQL Server
DB_IP=CHANGE_ME
DB_PORT=1433
DB_NAME=CHANGE_ME
DB_ENCRYPT=true
DB_TRUST_SERVER_CERTIFICATE=false

# Credenciais via variaveis de ambiente:
# DB_USER
# DB_PASSWORD

# CSLight
CSLIGHT_URL=CHANGE_ME

# Credenciais via variaveis de ambiente:
# CSLIGHT_USERNAME
# CSLIGHT_PASSWORD

# Quitacao smoke
QUITACAO_ID_CONTA_SMOKE=CHANGE_ME
QUITACAO_TIPO_CORRESPONDENCIA=1

# SOAP timeouts
SOAP_CONNECT_TIMEOUT_SECONDS=10
SOAP_RESPONSE_TIMEOUT_SECONDS=30
SOAP_CONNECTION_REQUEST_TIMEOUT_SECONDS=10